<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然免疫・炎症 60秒チャレンジ</title><style>body{font-family:system-ui,'Yu Gothic',sans-serif;background:#f1f5f9;color:#14253b;margin:0;padding:20px}.app{max-width:680px;margin:auto;background:white;border-radius:20px;padding:24px;box-shadow:0 8px 32px #14253b12}h1{font-size:1.5rem}.stats{display:flex;justify-content:space-between;gap:10px;font-weight:bold}.time{font-size:2rem;color:#2563eb}.bar{height:12px;background:#e2e8f0;border-radius:12px;overflow:hidden;margin:16px 0}.fill{height:100%;background:#2563eb;width:100%;transition:width .1s linear}.question{background:#eff6ff;border-radius:14px;padding:22px;font-size:1.2rem;font-weight:bold;min-height:85px}.choices{display:grid;gap:12px;margin:18px 0}button{font:inherit;cursor:pointer;border-radius:12px;padding:15px;border:1px solid #cbd5e1;background:white;text-align:left}button:hover{background:#eff6ff}button:disabled{cursor:default}.primary{background:#2563eb;color:white;border:0;text-align:center;font-weight:bold;width:100%}.primary:hover{background:#1d4ed8}.correct{background:#dcfce7!important;border-color:#16a34a}.wrong{background:#fee2e2!important;border-color:#dc2626}.muted{color:#64748b}.hide{display:none}.level{font-size:3rem;font-weight:900;color:#2563eb;text-align:center}.feedback{min-height:44px;font-weight:bold}.center{text-align:center}.small{font-size:.9rem}  .history{margin-top:22px;padding:16px;background:#f8fafc;border:1px solid #dbe4ef;border-radius:14px;text-align:left}.history h3{margin:0 0 8px}.history svg{display:block;width:100%;height:auto}.history-note{font-size:.85rem;color:#64748b;margin:8px 0 0}.history-empty{color:#64748b;font-size:.9rem}.history-grid{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem}.secondary{width:100%;text-align:center;margin-top:10px} </style></head><body><main class="app"><h1>🛡️ 自然免疫・炎症 60秒チャレンジ</h1><section id="intro"><p>高校1年・生物基礎｜全18問・3択</p><p>60秒以内に何問正解できるかな？回答すると約0.5秒後に自動で次へ進みます。</p><p class="small muted">レベルは正解数（最大90点）＋全問終了時の残り時間（最大10点）から計算します。</p><button class="primary" id="start">スタート</button><div id="introHistory" class="history"></div></section><section id="game" class="hide"><div class="stats"><div>問題 <span id="num">1</span>/<span id="total">18</span></div><div>正解 <span id="score">0</span></div><div class="time"><span id="clock">60.0</span>秒</div></div><div class="bar"><div id="fill" class="fill"></div></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div></section><section id="end" class="hide center"><h2 id="endtitle">結果発表</h2><div class="level" id="level"></div><p id="summary"></p><p id="breakdown" class="muted"></p><p id="record"></p><div id="endHistory" class="history"></div><button class="primary" id="review" style="margin-bottom:10px">間違えた・未回答の問題を復習</button><button class="primary" id="again">もう一度挑戦</button></section><section id="study" class="hide"><h2>復習モード（時間制限なし）</h2><p id="studyCount"></p><div class="question" id="studyQuestion"></div><div class="choices" id="studyChoices"></div><p id="studyFeedback" aria-live="polite"></p><button class="primary hide" id="studyNext">次の問題へ</button><button id="studyExit">結果に戻る</button></section></main><script>
const Q=[
['生まれつき備わっている免疫は？',['適応免疫','自然免疫','体液性免疫'],1,'自然免疫は生まれつき備わっています。'],
['皮膚や粘膜で異物の侵入を防ぐしくみは？',['物理的防御','化学的防御','食作用'],0,'皮膚や粘膜による防御は物理的防御です。'],
['涙や唾液に含まれる、細菌の細胞壁を分解する酵素は？',['ヒスタミン','抗体','リゾチーム'],2,'リゾチームは化学的防御に関わります。'],
['皮膚の表面を弱酸性に保ち、多くの病原体の繁殖を防ぐものは？',['汗や皮脂','涙や唾液','血液やリンパ液'],0,'汗や皮脂などによって皮膚の表面は弱酸性に保たれ、多くの病原体が増えにくくなります。'],
['胃液に含まれ、細菌などの増殖を抑える物質は？',['塩酸','インスリン','抗体'],0,'胃液の塩酸は強い酸性によって防御に役立ちます。'],
['鼻毛が異物の侵入を防ぐ働きは？',['化学的防御','物理的防御','適応免疫'],1,'鼻毛は異物を物理的に捕らえます。'],
['異物を細胞内に取り込んで処理する働きは？',['抗原提示','免疫記憶','食作用'],2,'食作用は食細胞が異物を取り込む働きです。'],
['食作用を行う細胞の総称は？',['食細胞','赤血球','血小板'],0,'好中球やマクロファージなどが食細胞です。'],
['細菌などを取り込む代表的な白血球は？',['B細胞','好中球','赤血球'],1,'好中球は食作用を行う白血球です。'],
['異物を取り込み、抗原提示にも関わる細胞は？',['血小板','赤血球','樹状細胞'],2,'樹状細胞は自然免疫と適応免疫をつなぎます。'],
['樹状細胞が異物の情報をT細胞に示すことは？',['抗原提示','食作用','免疫記憶'],0,'抗原提示は適応免疫の活性化につながります。'],
['傷口などで赤みや腫れが生じる反応は？',['免疫記憶','炎症','抗体産生'],1,'炎症は異物の侵入や組織の損傷に対する反応です。'],
['炎症で患部が赤く腫れる主な理由は？',['血管が拡張して血流が増えるから','抗体が減少するから','赤血球が細菌を取り込むから'],0,'血管が拡張して血流が増えることで赤みが生じます。また、血管から水分などがしみ出すことで腫れが生じます。'],
['炎症の際、血管から組織へ移動して細菌を取り込む細胞は？',['赤血球','血小板','好中球'],2,'好中球は血管外へ移動して食作用を行います。'],
['炎症が起こることの主な意義は？',['食作用を促進し組織の回復を促す','必ず体温を下げる','免疫の働きを停止させる'],0,'炎症では食細胞が集まりやすくなり、異物の排除と組織の回復を助けます。'],
['マクロファージの働きとして正しいものは？',['酸素だけを運搬する','異物や細胞の残骸を取り込む','血液を凝固させる'],1,'マクロファージは異物や細胞の残骸を処理します。'],
['自然免疫で重要な働きをする細胞の仲間は？',['赤血球','血小板','白血球'],2,'食細胞などの白血球が自然免疫で働きます。'],
['自然免疫からつながる、特定の抗原に対応する免疫は？',['適応免疫','物理的防御','化学的防御'],0,'適応免疫ではリンパ球が特定の抗原に対応します。']
];
const HISTORY_KEY='immuneQuizLevelHistoryV1';
function getHistory(){try{const v=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(v)?v.filter(x=>x&&Number.isInteger(x.level)&&x.level>=1&&x.level<=10):[]}catch(e){return []}}
function saveHistory(entry){const history=getHistory();history.push(entry);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history))}catch(e){}return history}
function drawHistory(id){const box=$(id),history=getHistory();box.replaceChildren();const title=document.createElement('h3');title.textContent='📈 レベルの推移';box.append(title);if(!history.length){const empty=document.createElement('p');empty.className='history-empty';empty.textContent='まだ記録がありません。チャレンジをすると、ここにレベルの変化が表示されます。';box.append(empty);return}const summary=document.createElement('div');summary.className='history-grid';const best=Math.max(...history.map(x=>x.level));summary.textContent='挑戦 '+history.length+'回　｜　最高レベル '+best+'　｜　最新レベル '+history[history.length-1].level;box.append(summary);
const NS='http://www.w3.org/2000/svg',width=620,height=260,left=38,right=16,top=18,bottom=40,plotW=width-left-right,plotH=height-top-bottom;const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','挑戦回数ごとのレベル推移を示す折れ線グラフ');function el(name,attrs,text){const e=document.createElementNS(NS,name);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;svg.append(e);return e}const displayed=history.slice(-30),offset=history.length-displayed.length;const x=n=>left+(displayed.length===1?plotW/2:n*plotW/(displayed.length-1));const y=lv=>top+(10-lv)*plotH/9;for(const lv of [1,3,5,7,10]){el('line',{x1:left,y1:y(lv),x2:width-right,y2:y(lv),stroke:'#dce5f0','stroke-dasharray':'4 5'});el('text',{x:26,y:y(lv)+4,'text-anchor':'end','font-size':12,fill:'#64748b'},String(lv))}if(displayed.length>1){el('polyline',{points:displayed.map((v,j)=>`${x(j)},${y(v.level)}`).join(' '),fill:'none',stroke:'#2563eb','stroke-width':3,'stroke-linecap':'round','stroke-linejoin':'round'})}displayed.forEach((v,j)=>{const c=el('circle',{cx:x(j),cy:y(v.level),r:displayed.length>20?4:5,fill:'#2563eb',stroke:'white','stroke-width':2});const tip=document.createElementNS(NS,'title');tip.textContent=`${offset+j+1}回目：レベル${v.level}（${v.score}問正解）`;c.append(tip)});const labels=[0,Math.floor((displayed.length-1)/2),displayed.length-1].filter((v,j,a)=>a.indexOf(v)===j);labels.forEach(j=>el('text',{x:x(j),y:height-14,'text-anchor':'middle','font-size':12,fill:'#64748b'},`${offset+j+1}回`));box.append(svg);const note=document.createElement('p');note.className='history-note';note.textContent='横軸：挑戦回数　縦軸：レベル（1〜10）'+(history.length>30?'／直近30回を表示':'')+'。復習モードは記録されません。';box.append(note)}
let i=0,score=0,deadline=0,timer=null,advance=null,locked=false,finished=false,attempts={},reviewIds=[],reviewIndex=0,reviewLocked=false;
const $=id=>document.getElementById(id);
function start(){clearInterval(timer);clearTimeout(advance);i=0;score=0;attempts={};locked=false;finished=false;$('intro').classList.add('hide');$('end').classList.add('hide');$('game').classList.remove('hide');$('study').classList.add('hide');deadline=performance.now()+60000;show();tick();timer=setInterval(tick,50)}
function remaining(){return Math.max(0,(deadline-performance.now())/1000)}
function tick(){const t=remaining();$('clock').textContent=t.toFixed(1);$('fill').style.width=(t/60*100)+'%';if(t<=0)finish()}
function show(){if(finished)return;if(i>=Q.length){finish();return}locked=false;$('num').textContent=i+1;$('total').textContent=Q.length;$('score').textContent=score;$('question').textContent=Q[i][0];$('feedback').textContent='';$('choices').replaceChildren();Q[i][1].forEach((a,j)=>{let b=document.createElement('button');b.textContent=['A','B','C'][j]+'．'+a;b.addEventListener('click',()=>answer(j));$('choices').append(b)})}
function answer(j){if(locked||finished||remaining()<=0)return;locked=true;const q=Q[i];attempts[i]=j;if(j===q[2])score++;$('score').textContent=score;[...$('choices').children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});$('feedback').textContent=(j===q[2]?'○ 正解！ ':'× 不正解。 ')+q[3];advance=setTimeout(()=>{if(finished)return;i++;show()},500)}
function finish(){if(finished)return;finished=true;const left=remaining();clearInterval(timer);clearTimeout(advance);$('game').classList.add('hide');$('end').classList.remove('hide');const accuracyPoints=score/Q.length*90;const timePoints=i>=Q.length?left/60*10:0;const points=accuracyPoints+timePoints;const level=Math.min(10,Math.max(1,Math.floor(points/10)+1));$('endtitle').textContent=i>=Q.length?'全18問クリア！':'60秒終了！';$('level').textContent='レベル '+level;$('summary').textContent='正解 '+score+' / '+Q.length+'問 ・ 残り '+left.toFixed(1)+'秒';$('breakdown').textContent='評価点 '+points.toFixed(1)+' / 100（正解点 '+accuracyPoints.toFixed(1)+' ＋ 時間ボーナス '+timePoints.toFixed(1)+'）';let best=0;try{best=Number(localStorage.getItem('immuneQuizBestLevel')||0)}catch(e){}const isNew=level>best;if(isNew){best=level;try{localStorage.setItem('immuneQuizBestLevel',String(best))}catch(e){}}$('record').textContent='🏆 今までの最高レベル：'+best+(isNew?'（新記録！）':'');saveHistory({level,score,remaining:Number(left.toFixed(1)),date:new Date().toISOString()});drawHistory('endHistory');drawHistory('introHistory');reviewIds=Q.map((q,k)=>k).filter(k=>attempts[k]!==Q[k][2]);$('review').style.display=reviewIds.length?'block':'none'}
function beginReview(){reviewIndex=0;$('end').classList.add('hide');$('study').classList.remove('hide');showReview()}
function showReview(){reviewLocked=false;const k=reviewIds[reviewIndex];if(k===undefined){$('studyCount').textContent='復習完了！';$('studyQuestion').textContent='すべての復習問題に取り組みました。';$('studyChoices').replaceChildren();$('studyFeedback').textContent='';$('studyNext').classList.add('hide');return}const q=Q[k];$('studyCount').textContent=(reviewIndex+1)+' / '+reviewIds.length+'問';$('studyQuestion').textContent=q[0];$('studyFeedback').textContent='';$('studyNext').classList.add('hide');$('studyChoices').replaceChildren();q[1].forEach((a,j)=>{const b=document.createElement('button');b.textContent=['A','B','C'][j]+'．'+a;b.onclick=()=>{if(reviewLocked)return;reviewLocked=true;[...$('studyChoices').children].forEach((x,n)=>{x.disabled=true;if(n===q[2])x.classList.add('correct');else if(n===j)x.classList.add('wrong')});$('studyFeedback').textContent=(j===q[2]?'○ 正解！ ':'× 不正解。 正解：'+q[1][q[2]]+'。 ')+q[3];$('studyNext').textContent=reviewIndex===reviewIds.length-1?'復習を終了':'次の問題へ';$('studyNext').classList.remove('hide')};$('studyChoices').append(b)})}
$('review').addEventListener('click',beginReview);$('studyNext').addEventListener('click',()=>{reviewIndex++;if(reviewIndex>=reviewIds.length){$('study').classList.add('hide');$('end').classList.remove('hide')}else showReview()});$('studyExit').addEventListener('click',()=>{$('study').classList.add('hide');$('end').classList.remove('hide')});
$('start').addEventListener('click',start);$('again').addEventListener('click',start);drawHistory('introHistory');
</script></body></html>
